<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Reserva de Horas Médicas</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Centro Médico Salud Integral</h1>
    <p>Sistema de reserva de horas médicas</p>
  </header>
  <main>
    <form>
      <label>Nombre completo:</label>
      <input type="text" required>
      <label>RUT:</label>
      <input type="text" required>
      <label>Especialidad:</label>
      <select>
        <option>Medicina general</option>
        <option>Pediatría</option>
      </select>
      <label>Fecha:</label>
      <input type="date" required>
      <button type="submit">Reservar hora</button>
    </form>
  </main>
</body>
</html>
